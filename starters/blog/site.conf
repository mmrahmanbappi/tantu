# Site settings. Change these to make the site yours.

title = Sam's Notes
tagline = Notes on code, study and life
description = A personal blog about learning to code, study tips and small projects.
author = Sam Rivera
job_title = Computer science student

# The address where your site will live. Examples:
#   https://yourname.github.io
#   https://yourname.github.io/my-blog
#   https://blog.yourdomain.com
base_url = https://yourname.github.io

language = en
locale = en_US
theme = blog

# Posts live in content/posts and appear under this path
section = blog
section_title = Blog
home_posts = 5

# Menu: Label:/path/, separated by commas
menu = Home:/, Blog:/blog/, About:/about/

# Search and social (all optional)
og_image = /images/og-default.png
favicon = favicon.svg
owner_type = Person
social = https://github.com/yourname
twitter =
google_verification =
bing_verification =
