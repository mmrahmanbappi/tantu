name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thank you for taking the time to report a problem. Please do not report security issues here. See SECURITY.md instead.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run tantu new mysite --theme blog
        2. ...
  - type: input
    id: version
    attributes:
      label: tantu version
      description: Run tantu version
      placeholder: tantu 1.0.0
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Windows, macOS, Linux, Other]
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output or error message
      render: text
