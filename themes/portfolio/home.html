<!doctype html>
<html lang="{{site_language}}">
<head>
{{> head}}</head>
<body>
{{> header}}
<main id="main">
  <section class="hero wrap">
    <div class="content">{{{content}}}</div>
  </section>
  {{#if recent}}
  <section class="work wrap" aria-labelledby="work">
    <h2 id="work">Selected {{site_section_title}}</h2>
    <ul class="grid">
      {{#each recent}}
      <li class="card">
        <a href="{{url}}">
          {{#if image}}<img src="{{base_path}}{{image}}" alt="{{image_alt}}" loading="lazy" width="800" height="500">{{/if}}
          <h3>{{title}}</h3>
          <p>{{description}}</p>
        </a>
      </li>
      {{/each}}
    </ul>
    <p class="more"><a class="button" href="{{list_url}}">See all {{site_section_title}}</a></p>
  </section>
  {{/if}}
</main>
{{> footer}}
</body>
</html>
