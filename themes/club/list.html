<!doctype html>
<html lang="{{site_language}}">
<head>
{{> head}}</head>
<body>
{{> header}}
<main id="main" class="wrap">
  <h1>{{title}}</h1>
  {{#if posts}}<ul class="cards">{{#each posts}}<li><a href="{{url}}"><span class="meta">{{date_display}}</span><h2>{{title}}</h2><p>{{description}}</p></a></li>{{/each}}</ul>{{else}}<p>Nothing here yet. Add a Markdown file to content/posts and build again.</p>{{/if}}
</main>
{{> footer}}
</body>
</html>
