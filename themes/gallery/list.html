<!doctype html>
<html lang="{{site_language}}">
<head>
{{> head}}</head>
<body>
{{> header}}
<main id="main" class="wrap">
  <h1>{{title}}</h1>
  {{#if posts}}<ul class="masonry">{{#each posts}}<li><a href="{{url}}">{{#if image}}<img src="{{base_path}}{{image}}" alt="{{image_alt}}" loading="lazy">{{/if}}<span class="cap">{{title}}</span></a></li>{{/each}}</ul>{{else}}<p>Nothing here yet. Add a Markdown file to content/posts and build again.</p>{{/if}}
</main>
{{> footer}}
</body>
</html>
