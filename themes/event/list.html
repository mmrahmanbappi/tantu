<!doctype html>
<html lang="{{site_language}}">
<head>
{{> head}}</head>
<body>
{{> header}}
<main id="main" class="wrap">
  <h1>{{title}}</h1>
  {{#if posts}}<ol class="sched">{{#each posts}}<li><span class="time">{{start_display}}</span><div><a href="{{url}}">{{title}}</a>{{#if speaker}}<span class="meta">{{speaker}}</span>{{/if}}{{#if location}}<span class="meta">{{location}}</span>{{/if}}</div></li>{{/each}}</ol>{{else}}<p>Nothing here yet. Add a Markdown file to content/posts and build again.</p>{{/if}}
</main>
{{> footer}}
</body>
</html>
